<body class="bg-background text-on-surface min-h-screen flex flex-col items-center justify-between antialiased selection:bg-secondary-container selection:text-on-secondary-container">
<!-- Shell Wrapper (Responsive Mobile/Tablet Canvas) -->
<main class="w-full max-w-lg min-h-screen flex flex-col justify-between px-4 py-4 md:py-8 mx-auto relative bg-surface">
<!-- Top Navigation Ribbon (Linear/Onboarding contextual header) -->
<header class="w-full flex items-center justify-between h-14">
<button aria-label="Retour" class="w-10 h-10 rounded-xl bg-surface-container-lowest flex items-center justify-center text-on-surface hover:bg-surface-container active:scale-95 transition-all shadow-sm border border-outline-variant/30" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_back">arrow_back</span>
</button>
<!-- Step Indicator Badge -->
<div class="flex items-center gap-2 bg-surface-container-low px-3 py-1.5 rounded-full border border-surface-variant/40">
<div class="flex gap-1">
<span class="w-2 h-1.5 rounded-full bg-primary-container"></span>
<span class="w-2 h-1.5 rounded-full bg-primary-container"></span>
<span class="w-5 h-1.5 rounded-full bg-secondary-container"></span>
<span class="w-2 h-1.5 rounded-full bg-outline-variant/50"></span>
</div>
<span class="font-label-sm text-label-sm text-primary font-bold">Étape 3 sur 4</span>
</div>
<!-- Security Status Badge -->
<div class="flex items-center gap-1.5 px-2.5 py-1 bg-surface-container-lowest rounded-xl border border-outline-variant/30 shadow-sm">
<span class="material-symbols-outlined text-[16px] text-secondary font-bold" data-icon="verified_user">verified_user</span>
<span class="font-label-sm text-label-sm text-on-surface font-bold">256-bit</span>
</div>
</header>
<!-- Main Content Focus Card & PIN Header -->
<div class="flex flex-col items-center text-center mt-2 mb-3">
<!-- Shield / Padlock Hero Badge -->
<div class="relative mb-3 group">
<div class="w-20 h-20 rounded-2xl bg-primary-container flex items-center justify-center shadow-[0_8px_24px_-4px_rgba(15,41,66,0.25)] border-t border-white/10 relative z-10 transition-transform duration-300">
<span class="material-symbols-outlined text-[40px] text-secondary-container" data-icon="shield_lock" style="font-variation-settings: 'FILL' 1;">shield_lock</span>
</div>
<!-- Ambient Solar Glow Aura -->
<div class="absolute -inset-2 bg-secondary-container/20 rounded-3xl blur-lg -z-0"></div>
<div class="absolute -bottom-1 -right-1 bg-secondary-container text-on-secondary-container rounded-full p-1 border-2 border-surface shadow-sm">
<span class="material-symbols-outlined text-[14px] font-bold block" data-icon="lock">lock</span>
</div>
</div>
<!-- Typography Header -->
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary tracking-tight mb-2">
        Définis ton Code PIN
      </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs mx-auto">
        Ce code à 4 chiffres protégera l'accès à tes notes, devoirs et budget à chaque ouverture de l'application.
      </p>
<!-- PIN Digits Representation Container -->
<div aria-label="Indicateur de saisie du PIN" class="mt-6 flex items-center justify-center gap-4 py-2" id="pin-dots-container" role="status">
<!-- Dot 1 (Filled) -->
<div class="pin-dot w-5 h-5 rounded-full border-2 border-primary-container bg-primary-container shadow-sm flex items-center justify-center transition-all duration-200">
<span class="w-2 h-2 rounded-full bg-secondary-container"></span>
</div>
<!-- Dot 2 (Filled) -->
<div class="pin-dot w-5 h-5 rounded-full border-2 border-primary-container bg-primary-container shadow-sm flex items-center justify-center transition-all duration-200">
<span class="w-2 h-2 rounded-full bg-secondary-container"></span>
</div>
<!-- Dot 3 (Empty / Active Cursor) -->
<div class="pin-dot w-5 h-5 rounded-full border-2 border-secondary-container bg-surface-container-lowest shadow-sm flex items-center justify-center transition-all duration-200 animate-pulse">
<span class="w-1.5 h-1.5 rounded-full bg-secondary-container"></span>
</div>
<!-- Dot 4 (Empty) -->
<div class="pin-dot w-5 h-5 rounded-full border-2 border-outline-variant/60 bg-surface-container-lowest shadow-sm transition-all duration-200"></div>
</div>
<p class="font-label-sm text-label-sm text-secondary font-bold mt-2">2 chiffres sur 4 renseignés</p>
</div>
<!-- Biometrics Quick Toggle Card -->

<!-- Virtual Tactile Keypad (Numpad) -->
<div class="w-full bg-surface-container-lowest/80 backdrop-blur-sm rounded-2xl border border-outline-variant/20 p-3 shadow-sm mb-3">
<div class="grid grid-cols-3 gap-2 sm:gap-3 max-w-sm mx-auto">
<!-- 1 -->
<button class="numpad-btn h-14 rounded-xl bg-surface-container-low hover:bg-surface-container text-primary font-headline-md text-headline-md flex flex-col items-center justify-center active:scale-95 transition-all shadow-sm" type="button">
<span class="">1</span>
<span class="font-label-sm text-[9px] text-on-surface-variant/70 tracking-widest font-normal uppercase -mt-1">&nbsp;</span>
</button>
<!-- 2 -->
<button class="numpad-btn h-14 rounded-xl bg-surface-container-low hover:bg-surface-container text-primary font-headline-md text-headline-md flex flex-col items-center justify-center active:scale-95 transition-all shadow-sm" type="button">
<span class="">2</span>
<span class="font-label-sm text-[9px] text-on-surface-variant tracking-widest font-bold uppercase -mt-1">ABC</span>
</button>
<!-- 3 -->
<button class="numpad-btn h-14 rounded-xl bg-surface-container-low hover:bg-surface-container text-primary font-headline-md text-headline-md flex flex-col items-center justify-center active:scale-95 transition-all shadow-sm" type="button">
<span class="">3</span>
<span class="font-label-sm text-[9px] text-on-surface-variant tracking-widest font-bold uppercase -mt-1">DEF</span>
</button>
<!-- 4 -->
<button class="numpad-btn h-14 rounded-xl bg-surface-container-low hover:bg-surface-container text-primary font-headline-md text-headline-md flex flex-col items-center justify-center active:scale-95 transition-all shadow-sm" type="button">
<span class="">4</span>
<span class="font-label-sm text-[9px] text-on-surface-variant tracking-widest font-bold uppercase -mt-1">GHI</span>
</button>
<!-- 5 -->
<button class="numpad-btn h-14 rounded-xl bg-surface-container-low hover:bg-surface-container text-primary font-headline-md text-headline-md flex flex-col items-center justify-center active:scale-95 transition-all shadow-sm" type="button">
<span class="">5</span>
<span class="font-label-sm text-[9px] text-on-surface-variant tracking-widest font-bold uppercase -mt-1">JKL</span>
</button>
<!-- 6 -->
<button class="numpad-btn h-14 rounded-xl bg-surface-container-low hover:bg-surface-container text-primary font-headline-md text-headline-md flex flex-col items-center justify-center active:scale-95 transition-all shadow-sm" type="button">
<span class="">6</span>
<span class="font-label-sm text-[9px] text-on-surface-variant tracking-widest font-bold uppercase -mt-1">MNO</span>
</button>
<!-- 7 -->
<button class="numpad-btn h-14 rounded-xl bg-surface-container-low hover:bg-surface-container text-primary font-headline-md text-headline-md flex flex-col items-center justify-center active:scale-95 transition-all shadow-sm" type="button">
<span class="">7</span>
<span class="font-label-sm text-[9px] text-on-surface-variant tracking-widest font-bold uppercase -mt-1">PQRS</span>
</button>
<!-- 8 -->
<button class="numpad-btn h-14 rounded-xl bg-surface-container-low hover:bg-surface-container text-primary font-headline-md text-headline-md flex flex-col items-center justify-center active:scale-95 transition-all shadow-sm" type="button">
<span class="">8</span>
<span class="font-label-sm text-[9px] text-on-surface-variant tracking-widest font-bold uppercase -mt-1">TUV</span>
</button>
<!-- 9 -->
<button class="numpad-btn h-14 rounded-xl bg-surface-container-low hover:bg-surface-container text-primary font-headline-md text-headline-md flex flex-col items-center justify-center active:scale-95 transition-all shadow-sm" type="button">
<span class="">9</span>
<span class="font-label-sm text-[9px] text-on-surface-variant tracking-widest font-bold uppercase -mt-1">WXYZ</span>
</button>
<!-- Key: Biometrics Shortcut -->
<div class="h-14 rounded-xl" aria-hidden="true"></div>
<!-- 0 -->
<button class="numpad-btn h-14 rounded-xl bg-surface-container-low hover:bg-surface-container text-primary font-headline-md text-headline-md flex flex-col items-center justify-center active:scale-95 transition-all shadow-sm" type="button">
<span class="">0</span>
<span class="font-label-sm text-[9px] text-on-surface-variant/70 tracking-widest font-normal uppercase -mt-1">+</span>
</button>
<!-- Backspace / Delete -->
<button aria-label="Effacer le dernier chiffre" class="numpad-btn h-14 rounded-xl bg-surface hover:bg-surface-container text-on-surface flex items-center justify-center active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[24px]" data-icon="backspace">backspace</span>
</button>
</div>
</div>
<!-- Action Section & Reassurance Notice -->
<div class="w-full flex flex-col gap-3">
<!-- Primary Action Button -->
<button class="w-full h-12 rounded-xl bg-primary-container text-on-primary font-label-lg text-label-lg font-semibold flex items-center justify-center gap-2 shadow-[0_4px_16px_-2px_rgba(15,41,66,0.15)] hover:bg-primary active:scale-[0.98] transition-all" type="button">
<span class="">Confirmer le code PIN</span>
<span class="material-symbols-outlined text-[18px] text-secondary-container" data-icon="arrow_forward">arrow_forward</span>
</button>
<!-- Reassurance Micro-Banner -->
<div class="flex items-center justify-center gap-1.5 py-1 text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] text-outline" data-icon="info">info</span>
<p class="font-body-sm text-body-sm text-center">
          Ne partage jamais ton code PIN. Il reste strictement confidentiel.
        </p>
</div>
</div>
</main>


</body></html>
