<body class="bg-surface text-on-surface font-body-md text-body-md antialiased min-h-full flex flex-col">
<!-- Mobile Wrapper Container max-w-lg -->
<main class="w-full max-w-lg mx-auto flex-1 flex flex-col pb-10">
<!-- Top Task-Focused Navigation Bar -->
<header class="sticky top-0 z-30 bg-surface/90 backdrop-blur-md px-4 py-3 border-b border-surface-variant/30 flex items-center justify-between">
<button aria-label="Retour au budget" class="w-10 h-10 rounded-full flex items-center justify-center text-primary hover:bg-surface-container active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
</button>
<div class="text-center">
<span class="font-label-sm text-label-sm uppercase tracking-wider text-secondary">Gestionnaire Budgétaire</span>
<h1 class="font-headline-sm text-headline-sm text-primary leading-tight">Ajouter une Transaction</h1>
</div>
<button aria-label="Aide financière" class="w-10 h-10 rounded-full flex items-center justify-center text-outline hover:bg-surface-container active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined" data-icon="help_outline">help_outline</span>
</button>
</header>
<!-- Context / Subtitle Header Banner -->
<section class="px-4 pt-4 pb-2">
<div class="bg-surface-container-low border border-surface-variant/40 rounded-xl p-3 flex items-start gap-3">
<div class="w-8 h-8 rounded-lg bg-surface-container-highest flex items-center justify-center text-primary shrink-0 mt-0.5">
<span class="material-symbols-outlined text-lg" data-icon="insights">insights</span>
</div>
<div>
<p class="font-label-md text-label-md text-primary font-bold">Garde la maîtrise de ton argent</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">Chaque transaction ajuste instantanément ton reste à vivre journalier jusqu'à la fin du mois.</p>
</div>
</div>
</section>
<!-- Main Transaction Form -->
<form class="px-4 flex flex-col gap-5 mt-2" id="transaction-form" onsubmit="event.preventDefault();">
<!-- 1. Transaction Type Segmented Switch -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-2">Type d'opération</label>
<div class="grid grid-cols-2 p-1.5 bg-surface-container rounded-2xl gap-1">
<!-- Dépense Option (Active by default) -->
<button class="flex items-center justify-center gap-2 py-3 px-3 rounded-xl font-label-lg text-label-lg bg-surface-container-lowest text-error shadow-sm transition-all" id="btn-expense" type="button">
<span class="material-symbols-outlined text-base" data-icon="arrow_outward">arrow_outward</span>
<span>Dépense (Sortie)</span>
</button>
<!-- Entrée Option -->
<button class="flex items-center justify-center gap-2 py-3 px-3 rounded-xl font-label-lg text-label-lg text-on-surface-variant hover:text-primary transition-all" id="btn-income" type="button">
<span class="material-symbols-outlined text-base" data-icon="south_west">south_west</span>
<span>Entrée d'argent</span>
</button>
</div>
</div>
<!-- 2. Montant en FCFA with Quick Increase Badges -->
<div class="bg-surface-container-lowest p-5 rounded-2xl border border-primary-container/10 shadow-[0_4px_16px_-2px_rgba(15,41,66,0.05)] text-center">
<span class="font-label-sm text-label-sm uppercase tracking-wider text-outline">Montant de l'opération</span>
<div class="flex items-baseline justify-center gap-2 mt-2 mb-4">
<input class="font-display text-display font-extrabold text-primary w-48 text-center bg-transparent border-0 focus:ring-0 p-0 selection:bg-secondary-container" id="amount-input" min="0" placeholder="0" step="100" type="number" value="3500">
<span class="font-headline-md text-headline-md text-secondary font-extrabold">FCFA</span>
</div>
<!-- Quick Addition Pills -->
<div class="flex items-center justify-center flex-wrap gap-1.5 pt-2 border-t border-surface-variant/30">
<span class="font-label-sm text-label-sm text-on-surface-variant mr-1">Raccourcis:</span>
<button class="px-2.5 py-1 rounded-full bg-surface-container text-primary font-label-md text-label-md active:scale-95 transition-transform hover:bg-surface-container-high" onclick="addAmount(500)" type="button">
            +500
          </button>
<button class="px-2.5 py-1 rounded-full bg-surface-container text-primary font-label-md text-label-md active:scale-95 transition-transform hover:bg-surface-container-high" onclick="addAmount(1000)" type="button">
            +1 000
          </button>
<button class="px-2.5 py-1 rounded-full bg-surface-container text-primary font-label-md text-label-md active:scale-95 transition-transform hover:bg-surface-container-high" onclick="addAmount(2000)" type="button">
            +2 000
          </button>
<button class="px-2.5 py-1 rounded-full bg-surface-container text-primary font-label-md text-label-md active:scale-95 transition-transform hover:bg-surface-container-high" onclick="addAmount(5000)" type="button">
            +5 000
          </button>
</div>
</div>
<!-- 3. Catégorie étudiante avec icônes illustrées -->
<div>
<div class="flex items-center justify-between mb-2">
<label class="font-label-md text-label-md text-on-surface-variant">Catégorie étudiante</label>
<span class="font-label-sm text-label-sm text-outline">Obligatoire</span>
</div>
<div class="grid grid-cols-2 gap-2.5" id="category-grid">
<!-- Option 1: Internet -->
<button class="category-btn text-left p-3 rounded-xl border border-surface-variant/60 bg-surface-container-lowest hover:border-primary-container/30 transition-all flex items-center gap-3" type="button">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary shrink-0">
<span class="material-symbols-outlined" data-icon="wifi">wifi</span>
</div>
<div class="min-w-0">
<p class="font-label-md text-label-md text-primary truncate font-semibold">Forfait Internet</p>
<p class="font-body-sm text-body-sm text-outline truncate">Pass data &amp; box</p>
</div>
</button>
<!-- Option 2: Transports (Selected by Default) -->
<button class="category-btn text-left p-3 rounded-xl border-2 border-primary bg-surface-container-low shadow-sm transition-all flex items-center gap-3 relative" type="button">
<div class="w-10 h-10 rounded-full bg-primary-container text-surface-bright flex items-center justify-center shrink-0">
<span class="material-symbols-outlined" data-icon="directions_bus">directions_bus</span>
</div>
<div class="min-w-0">
<p class="font-label-md text-label-md text-primary truncate font-bold">Transports</p>
<p class="font-body-sm text-body-sm text-primary-container truncate">Bus, Woro, Gbaka</p>
</div>
<div class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-secondary"></div>
</button>
<!-- Option 3: Fournitures -->
<button class="category-btn text-left p-3 rounded-xl border border-surface-variant/60 bg-surface-container-lowest hover:border-primary-container/30 transition-all flex items-center gap-3" type="button">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary shrink-0">
<span class="material-symbols-outlined" data-icon="print">print</span>
</div>
<div class="min-w-0">
<p class="font-label-md text-label-md text-primary truncate font-semibold">Photocopies</p>
<p class="font-body-sm text-body-sm text-outline truncate">Polys &amp; fournitures</p>
</div>
</button>
<!-- Option 4: Repas Resto U -->
<button class="category-btn text-left p-3 rounded-xl border border-surface-variant/60 bg-surface-container-lowest hover:border-primary-container/30 transition-all flex items-center gap-3" type="button">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary shrink-0">
<span class="material-symbols-outlined" data-icon="restaurant">restaurant</span>
</div>
<div class="min-w-0">
<p class="font-label-md text-label-md text-primary truncate font-semibold">Repas CROU</p>
<p class="font-body-sm text-body-sm text-outline truncate">Resto U &amp; cafétéria</p>
</div>
</button>
<!-- Option 5: Bourse & Famille -->
<button class="category-btn text-left p-3 rounded-xl border border-surface-variant/60 bg-surface-container-lowest hover:border-primary-container/30 transition-all flex items-center gap-3" type="button">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary shrink-0">
<span class="material-symbols-outlined" data-icon="family_restroom">family_restroom</span>
</div>
<div class="min-w-0">
<p class="font-label-md text-label-md text-primary truncate font-semibold">Aide &amp; Bourse</p>
<p class="font-body-sm text-body-sm text-outline truncate">Soutien familial</p>
</div>
</button>
<!-- Option 6: Petits jobs -->
<button class="category-btn text-left p-3 rounded-xl border border-surface-variant/60 bg-surface-container-lowest hover:border-primary-container/30 transition-all flex items-center gap-3" type="button">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary shrink-0">
<span class="material-symbols-outlined" data-icon="work_outline">work_outline</span>
</div>
<div class="min-w-0">
<p class="font-label-md text-label-md text-primary truncate font-semibold">Petits boulots</p>
<p class="font-body-sm text-body-sm text-outline truncate">Répétitions &amp; cours</p>
</div>
</button>
</div>
</div>
<!-- 4. Description courte -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1.5" for="desc-input">Intitulé de la dépense</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl px-4 py-3 text-primary font-body-md text-body-md focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all" id="desc-input" placeholder="Ex: Carte mensuelle de bus campus" type="text" value="Pass mensuel bus campus &amp; woro-woro">
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary p-1" type="button">
<span class="material-symbols-outlined text-lg" data-icon="edit_note">edit_note</span>
</button>
</div>
</div>
<!-- 5. Switch Dépense récurrente -->
<div class="bg-surface-container-lowest p-4 rounded-xl border border-surface-variant/40 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-9 h-9 rounded-lg bg-surface-container flex items-center justify-center text-on-primary-fixed-variant">
<span class="material-symbols-outlined" data-icon="autorenew">autorenew</span>
</div>
<div>
<p class="font-label-md text-label-md text-primary font-bold">Dépense récurrente</p>
<p class="font-body-sm text-body-sm text-outline">Répéter chaque mois le 1er</p>
</div>
</div>
<!-- Toggle button -->
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox">
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-container"></div>
</label>
</div>
<!-- 6. Encart Instructif en direct 'Impact sur ton reste à vivre' (Smart Predictor) -->

<!-- 7. Action Buttons -->
<div class="flex flex-col gap-2.5 pt-2">
<!-- Bouton Principal Jaune -->
<button class="w-full h-12 rounded-xl bg-secondary-container text-primary font-label-lg text-label-lg font-bold flex items-center justify-center gap-2 shadow-sm active:scale-98 hover:brightness-105 transition-all" type="submit">
<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
<span class="">Enregistrer la transaction</span>
</button>
<!-- Bouton Rapide Ajouter un Reçu -->
<button class="w-full h-11 rounded-xl bg-surface-container hover:bg-surface-container-high text-primary font-label-md text-label-md font-semibold flex items-center justify-center gap-2 border border-outline-variant/40 active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-base" data-icon="photo_camera">photo_camera</span>
<span class="">Joindre un reçu ou ticket Wave/Orange Money</span>
</button>
</div>
</form>
</main>
<!-- Interactive script for dynamic updates -->
<script>
    function addAmount(value) {
      const input = document.getElementById('amount-input');
      const current = parseInt(input.value || '0', 10);
      input.value = current + value;
    }

    // Toggle Expense / Income visually
    const btnExpense = document.getElementById('btn-expense');
    const btnIncome = document.getElementById('btn-income');

    btnExpense.addEventListener('click', () => {
      btnExpense.className = "flex items-center justify-center gap-2 py-3 px-3 rounded-xl font-label-lg text-label-lg bg-surface-container-lowest text-error shadow-sm transition-all";
      btnIncome.className = "flex items-center justify-center gap-2 py-3 px-3 rounded-xl font-label-lg text-label-lg text-on-surface-variant hover:text-primary transition-all";
    });

    btnIncome.addEventListener('click', () => {
      btnIncome.className = "flex items-center justify-center gap-2 py-3 px-3 rounded-xl font-label-lg text-label-lg bg-surface-container-lowest text-secondary shadow-sm transition-all";
      btnExpense.className = "flex items-center justify-center gap-2 py-3 px-3 rounded-xl font-label-lg text-label-lg text-on-surface-variant hover:text-primary transition-all";
    });

    // Category button selection styling
    const categoryButtons = document.querySelectorAll('.category-btn');
    categoryButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        categoryButtons.forEach(b => {
          b.className = "category-btn text-left p-3 rounded-xl border border-surface-variant/60 bg-surface-container-lowest hover:border-primary-container/30 transition-all flex items-center gap-3";
          const iconBox = b.querySelector('div:first-child');
          if (iconBox) iconBox.className = "w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary shrink-0";
        });
        btn.className = "category-btn text-left p-3 rounded-xl border-2 border-primary bg-surface-container-low shadow-sm transition-all flex items-center gap-3 relative";
        const activeIconBox = btn.querySelector('div:first-child');
        if (activeIconBox) activeIconBox.className = "w-10 h-10 rounded-full bg-primary-container text-surface-bright flex items-center justify-center shrink-0";
      });
    });
  </script>


</body></html>
